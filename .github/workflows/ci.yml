name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: linux-port
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libudev-dev pkg-config

      - name: Build
        run: |
          meson setup build
          ninja -C build

      - name: Unit tests
        run: meson test -C build --print-errorlogs
